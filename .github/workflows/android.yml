# Builds the installable release APK from the android/ project.
# - Every push to main: the APK is kept as a workflow artifact (for testing).
# - A tag like v1.1.0: the APK is also attached to a GitHub release.
# - It can also be started by hand from the Actions tab.
#
# The APK is signed with the release key stored in these repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the PKCS12 keystore
#   ANDROID_KEYSTORE_PASSWORD keystore (and key) password
#   ANDROID_KEY_ALIAS         key alias
# Without them (e.g. in a fork) the APK is signed with the debug key instead.
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      # Gradle would download the NDK in the middle of the build; installing it
      # up front lets a corrupted download be retried.
      - name: Install the Android NDK
        run: |
          NDK=$(sed -nE 's/.*ndkVersion *= *"([^"]+)".*/\1/p' android/build.gradle)
          echo "NDK $NDK"
          for attempt in 1 2 3; do
            if yes 2> /dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" > /dev/null; then break; fi
            echo "::warning::NDK download failed (attempt $attempt), retrying"
            sleep 20
          done
          test -f "$ANDROID_HOME/ndk/$NDK/source.properties"

      - name: Build the release APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          SIGNING=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
            SIGNING=(
              "-PKMCALC_STORE_FILE=$RUNNER_TEMP/release.p12"
              "-PKMCALC_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              "-PKMCALC_KEY_ALIAS=$KEY_ALIAS"
              "-PKMCALC_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            )
          else
            echo "::warning::No release key configured: the APK is signed with the debug key."
          fi
          ./gradlew assembleRelease --no-daemon "${SIGNING[@]}"

      - name: Name the APK after the version
        id: apk
        run: |
          VERSION=$(sed -nE 's/.*versionName "([^"]+)".*/\1/p' android/app/build.gradle)
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/KmCalc-v$VERSION.apk"
          echo "file=out/KmCalc-v$VERSION.apk" >> "$GITHUB_OUTPUT"
          ls -lh out

      - name: Verify the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.file }}"

      - uses: actions/upload-artifact@v7
        with:
          name: KmCalc-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
